name: Python Emitter Regen Diff Comment

# Posts/updates the PR comment for the "Python Emitter Regen Diff" workflow.
# Uses the secure workflow_run pattern (this workflow runs in the base repo context
# with write permission and does NOT build any PR code) so it also works for fork PRs.
# https://securitylab.github.com/research/github-actions-preventing-pwn-requests/

on:
  workflow_run:
    workflows: ["Python Emitter Regen Diff"]
    types: [completed]

permissions:
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download comment payload
        uses: actions/download-artifact@v8
        with:
          name: python-regen-diff-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: comment-payload

      - name: Post or update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const prNumber = parseInt(
              fs.readFileSync('comment-payload/pr-number.txt', 'utf8').trim(),
              10,
            );
            if (!prNumber) {
              core.info('No PR number in payload; nothing to comment on.');
              return;
            }

            const runUrl = context.payload.workflow_run.html_url;
            let body = fs.readFileSync('comment-payload/comment-body.md', 'utf8');
            // The diff workflow leaves a placeholder; point it at the run page,
            // which lists the `python-regen-diff-html` artifact for download.
            body = body.replaceAll('__ARTIFACT_URL__', runUrl);

            const marker = '<!-- python-regen-diff -->';
            body = `${marker}\n${body}`;

            const { owner, repo } = context.repo;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body && c.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated comment ${existing.id} on PR #${prNumber}.`);
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              });
              core.info(`Created comment on PR #${prNumber}.`);
            }
