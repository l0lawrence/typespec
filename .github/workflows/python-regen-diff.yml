name: Python Regen Diff

# Regenerates the Python emitter test output for a PR and renders an HTML diff
# against the assets baseline. This workflow runs with the (possibly fork)
# pull_request token, which is read-only, so it only *builds* the diff and
# uploads it as an artifact. A companion workflow (python-regen-diff-publish.yml)
# runs via workflow_run with write permissions to publish the HTML to GitHub
# Pages and post the PR comment. No PAT / extra secret is required.

on:
  pull_request:
    branches: ["main", "l0lawrence/python-regen-html-diff"]
    paths:
      - "packages/http-client-python/**"
      - ".github/workflows/python-regen-diff.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: "Render generated-test diff"
    runs-on: ubuntu-latest
    if: |
      !startsWith(github.head_ref, 'dependabot/') &&
      !startsWith(github.head_ref, 'publish/') &&
      !startsWith(github.head_ref, 'backmerge/') &&
      !startsWith(github.head_ref, 'revert-')
    defaults:
      run:
        working-directory: packages/http-client-python
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build http-client-python
        run: |
          npm install --ignore-scripts
          npm run build

      - name: Prepare Python environment
        run: |
          npm run install
          npm run prepare

      - name: Regenerate tests
        run: npm run regenerate

      - name: Render HTML diff
        env:
          DIFF_TITLE: "Python emitter generated test diff (PR #${{ github.event.pull_request.number || 'manual' }})"
        run: npm run regenerate:render-diff -- --output "${{ runner.temp }}/diff-site" --title "$DIFF_TITLE"

      - name: Record PR metadata
        run: echo "${{ github.event.pull_request.number }}" > "${{ runner.temp }}/diff-site/pr.txt"

      - name: Upload diff site
        uses: actions/upload-artifact@v7
        with:
          name: python-regen-diff
          path: ${{ runner.temp }}/diff-site
          retention-days: 7
